<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrar empleado</title>
</head>
<body>
    <h1>Registrar empleado</h1>
    <form th:action="@{/formulario}" th:object="${empleado}" method="post">
        <p>Nombre: <input type="text" th:field="*{nombre}"></p>
        <p>Apellido: <input type="text" th:field="*{apellido}"></p>
        <p>Dirección: <input type="text" th:field="*{direccion}"></p>
        <p>Puesto: <input type="text" th:field="*{puesto}"></p>
        <p>Edad: <input type="number" th:field="*{edad}"></p>
        <p>Teléfono: <input type="number" th:field="*{telefono}"></p>
        <p>ID: <input type="number" th:field="*{id}"></p>
        <button type="submit">Enviar</button>
    </form>

    <p>Proyecto hecho por: <span th:text="${usuario}"></span></p>
</body>
</html>
